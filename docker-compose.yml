services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file: .env
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - notifications

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    env_file: .env
    environment:
      PORT: "8083"
