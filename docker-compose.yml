services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file: .env
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - users
      - notifications

  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    env_file: .env
    environment:
      PORT: "8081"
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    env_file: .env
    environment:
      PORT: "8083"
    depends_on:
      cassandra:
        condition: service_healthy

  cassandra:
    image: cassandra:5
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:-drive-cluster}
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP:-512M}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-128M}
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  cassandra-data:
  mongo-data:
